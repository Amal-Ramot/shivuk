name: עדכון מחירים ופרסום ל-GitHub Pages

# עדכון אוטומטי (יומי ובכל שינוי) הושבת לבקשת בעל המאגר.
# להרצה ידנית: Actions → "עדכון מחירים ופרסום ל-GitHub Pages" → Run workflow.
# להחזרת העדכון היומי — להוסיף:
#   schedule:
#     - cron: "17 3 * * *"
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # בדחיפה — מפרסמים רק מהענף הראשי של המאגר
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # המחירים נשמרים בזיכרון מטמון ומשמשים שוב בשינויים באתר עצמו
      - name: שחזור נתוני המחירים האחרונים
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: site/data
          key: price-data-${{ github.run_id }}
          restore-keys: price-data-

      # הורדה מלאה רק בעדכון היומי, בהרצה ידנית, כששונה קוד עיבוד הנתונים, או כשאין נתונים שמורים
      - name: האם צריך להוריד מחירים מחדש?
        id: need
        run: |
          fetch=false
          if [ "${{ github.event_name }}" != "push" ]; then fetch=true; fi
          if [ ! -f site/data/meta.json ]; then fetch=true; fi
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            if ! git cat-file -e "$before" 2>/dev/null || [ -n "$(git diff --name-only "$before" "${{ github.sha }}" -- scripts/)" ]; then
              fetch=true
            fi
          fi
          echo "fetch=$fetch" >> "$GITHUB_OUTPUT"
          echo "fetch=$fetch"

      - uses: actions/setup-python@v5
        if: steps.need.outputs.fetch == 'true'
        with:
          python-version: "3.12"

      - name: הורדת מחירונים מהרשתות ובניית נתונים
        if: steps.need.outputs.fetch == 'true'
        run: |
          rm -rf site/data
          python scripts/fetch_prices.py --out site/data

      - name: שמירת נתוני המחירים לשימוש חוזר
        if: steps.need.outputs.fetch == 'true'
        uses: actions/cache/save@v4
        with:
          path: site/data
          key: price-data-${{ github.run_id }}

      - name: סיכום
        run: |
          cat site/data/meta.json
          du -sh site/data

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
