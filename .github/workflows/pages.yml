name: עדכון מחירים ופרסום ל-GitHub Pages

on:
  push:
  workflow_dispatch:
  schedule:
    # כל יום ב-06:17 שעון ישראל (03:17 UTC), אחרי שהרשתות מפרסמות מחירונים מלאים
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # בדחיפה — מפרסמים רק מהענף הראשי של המאגר
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: הורדת מחירונים מהרשתות ובניית נתונים
        run: python scripts/fetch_prices.py --out site/data

      - name: סיכום
        run: |
          cat site/data/meta.json
          du -sh site/data

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
